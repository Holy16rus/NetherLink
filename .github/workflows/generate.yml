name: Generate Proxy Config

on:
  schedule:
    - cron: "0 */10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sources.json
      - backend/**

concurrency:
  group: netherlink-state-branch
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache sing-box binary
        uses: actions/cache@v4
        id: singbox-cache
        with:
          # apt-get install sing-box кладёт бинарник в /usr/bin, а не /usr/local/bin.
          # Путь кеша должен совпадать с реальным расположением, иначе кеш никогда не хитится.
          path: /usr/bin/sing-box
          key: sing-box-${{ runner.os }}-1.11.5
          restore-keys: sing-box-${{ runner.os }}-

      - name: Install sing-box
        if: steps.singbox-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://sing-box.app/gpg.key | sudo tee /etc/apt/trusted.gpg.d/sagernet.asc
          echo "deb https://deb.sagernet.org/ * *" | sudo tee /etc/apt/sources.list.d/sagernet.list
          sudo apt-get update && sudo apt-get install -y sing-box

      - name: Install Xray core (Happ-совместимый клиент)
        run: |
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v25.12.8/Xray-linux-64.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/xray.zip').extractall('/tmp/xray')"
          sudo cp /tmp/xray/xray /usr/local/bin/xray
          sudo cp /tmp/xray/geoip.dat /tmp/xray/geosite.dat /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download GeoIP database
        env:
          GEOIP_LICENSE_KEY: ${{ secrets.GEOIP_LICENSE_KEY }}
        run: python -m backend.download_geoip
        continue-on-error: true

      - name: Restore proxy history from stats branch
        run: |
          git fetch origin stats 2>/dev/null && git show stats:proxy-history.json > proxy-history.json 2>/dev/null || echo "{}" > proxy-history.json

      - name: Run proxy generator
        run: python -m backend.headless

      - name: Deploy configs to subscription + stats branches
        run: |
          git config user.name "NetherLink Bot"
          git config user.email "bot@netherlink.local"

          DATE=$(date -u +'%d.%m.%y')

          # Сохраняем сгенерированные файлы ДО переключения ветки
          mkdir -p /tmp/nl-deploy
          cp -f NetherLink*.yaml NetherLink*.json NetherLink-Xray*.txt live.txt proxy-history.json /tmp/nl-deploy/ 2>/dev/null || true

          # ── subscription: только конфиги (без live.txt) ──
          git checkout --orphan subscription
          git rm -rf . 2>/dev/null || true
          git clean -fdx 2>/dev/null || true
          cp -f /tmp/nl-deploy/NetherLink*.yaml /tmp/nl-deploy/NetherLink*.json /tmp/nl-deploy/NetherLink-Xray*.txt . 2>/dev/null || true
          git add -f -A
          git commit --allow-empty -m "Auto-generate proxy configs $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin subscription

          # ── stats: накопительные {дата}-LiveProxy + история проверок ──
          git fetch origin stats 2>/dev/null || true
          mkdir -p /tmp/nl-stats
          if git rev-parse --verify origin/stats >/dev/null 2>&1; then
            git archive origin/stats | tar -x -C /tmp/nl-stats 2>/dev/null || true
          fi
          git checkout --orphan stats
          git rm -rf . 2>/dev/null || true
          git clean -fdx 2>/dev/null || true
          cp -f /tmp/nl-stats/*LiveProxy* . 2>/dev/null || true
          cp -f /tmp/nl-deploy/live.txt "${DATE}-LiveProxy"
          cp -f /tmp/nl-deploy/proxy-history.json .
          git add -f -A
          git commit --allow-empty -m "Stats ${DATE} ($(date -u +'%H:%M UTC'))"
          git push --force origin stats
