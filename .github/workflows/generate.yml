name: Generate Proxy Config

on:
  schedule:
    - cron: "0 */10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sources.json
      - backend/**

concurrency:
  group: netherlink-state-branch
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache sing-box binary
        uses: actions/cache@v4
        id: singbox-cache
        with:
          # apt-get install sing-box кладёт бинарник в /usr/bin, а не /usr/local/bin.
          # Путь кеша должен совпадать с реальным расположением, иначе кеш никогда не хитится.
          path: /usr/bin/sing-box
          key: sing-box-${{ runner.os }}-1.11.5
          restore-keys: sing-box-${{ runner.os }}-

      - name: Install sing-box
        if: steps.singbox-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://sing-box.app/gpg.key | sudo tee /etc/apt/trusted.gpg.d/sagernet.asc
          echo "deb https://deb.sagernet.org/ * *" | sudo tee /etc/apt/sources.list.d/sagernet.list
          sudo apt-get update && sudo apt-get install -y sing-box

      - name: Install Xray core (Happ-совместимый клиент)
        run: |
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v25.12.8/Xray-linux-64.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/xray.zip').extractall('/tmp/xray')"
          sudo cp /tmp/xray/xray /usr/local/bin/xray
          sudo cp /tmp/xray/geoip.dat /tmp/xray/geosite.dat /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download GeoIP database
        env:
          GEOIP_LICENSE_KEY: ${{ secrets.GEOIP_LICENSE_KEY }}
        run: python -m backend.download_geoip
        continue-on-error: true

      - name: Restore proxy history from state branch
        run: |
          git fetch origin state 2>/dev/null && git show state:proxy-history.json > proxy-history.json 2>/dev/null || echo "{}" > proxy-history.json

      - name: Run proxy generator
        run: python -m backend.headless

      - name: Deploy configs to gh-pages (clean)
        run: |
          git config user.name "NetherLink Bot"
          git config user.email "bot@netherlink.local"

          # Сохраняем сгенерированные файлы ДО переключения ветки
          mkdir -p /tmp/nl-deploy
          cp -f NetherLink*.yaml NetherLink*.json NetherLink*.txt live.txt proxy-history.json /tmp/nl-deploy/ 2>/dev/null || true

          # ── gh-pages: только конфиги, без мусора ──
          git fetch origin gh-pages 2>/dev/null && git checkout gh-pages || git checkout --orphan gh-pages
          rm -f NetherLink*.yaml NetherLink*.json NetherLink*.txt live.txt proxy-history.json liveproxy.txt
          rm -rf backend GeoIP Proxy-Data sub 2>/dev/null || true
          cp -f /tmp/nl-deploy/NetherLink*.yaml /tmp/nl-deploy/NetherLink*.json /tmp/nl-deploy/NetherLink*.txt /tmp/nl-deploy/live.txt . 2>/dev/null || true
          git add -A
          git commit --allow-empty -m "Auto-generate proxy configs $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin gh-pages

          # ── state: персистентная история проверок ──
          git checkout --orphan state-new
          cp -f /tmp/nl-deploy/proxy-history.json . 2>/dev/null || true
          git add proxy-history.json 2>/dev/null || true
          git commit --allow-empty -m "Proxy history $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin state-new:state
