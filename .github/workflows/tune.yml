name: Tune Sources

# Раз в неделю: реальная отдача каждого источника (строгая проверка) -> source-overrides.json
# в ветке stats. generate/recheck подхватывают его и включают/выключают источники.
on:
  schedule:
    - cron: "40 3 * * 1"
  workflow_dispatch:

concurrency:
  group: netherlink-state-branch
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache mihomo binary (ядро FLClash — строгая проверка нод)
        uses: actions/cache@v4
        id: mihomo-cache
        with:
          path: /usr/local/bin/mihomo
          key: mihomo-${{ runner.os }}-1.19.32

      - name: Install mihomo
        if: steps.mihomo-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-compatible-v1.19.32.gz
          gunzip -c /tmp/mihomo.gz | sudo tee /usr/local/bin/mihomo > /dev/null
          sudo chmod +x /usr/local/bin/mihomo
          /usr/local/bin/mihomo -v

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tune sources
        run: python -m backend.tune_sources

      - name: Save overrides to stats branch
        if: success()
        run: |
          git config user.name "NetherLink Tuner"
          git config user.email "bot@netherlink.local"
          git fetch --no-tags --depth=1 origin +refs/heads/stats:refs/remotes/origin/stats 2>/dev/null || true
          mkdir -p /tmp/nl-stats /tmp/nl-tune
          cp -f source-overrides.json /tmp/nl-tune/
          if git rev-parse --verify origin/stats >/dev/null 2>&1; then
            git archive origin/stats | tar -x -C /tmp/nl-stats 2>/dev/null || true
          fi
          git checkout --orphan stats
          git rm -rf . 2>/dev/null || true
          git clean -fdx 2>/dev/null || true
          cp -f /tmp/nl-stats/*LiveProxy* . 2>/dev/null || true
          cp -f /tmp/nl-stats/proxy-history.json /tmp/nl-stats/pool.json . 2>/dev/null || true
          cp -f /tmp/nl-tune/source-overrides.json .
          git add -f -A
          git commit --allow-empty -m "Source overrides $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin stats
