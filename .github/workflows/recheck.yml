name: Recheck Top Proxies

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: netherlink-state-branch
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache sing-box binary
        uses: actions/cache@v4
        id: singbox-cache
        with:
          # apt-get install sing-box кладёт бинарник в /usr/bin, а не /usr/local/bin.
          path: /usr/bin/sing-box
          key: sing-box-${{ runner.os }}-1.11.5
          restore-keys: sing-box-${{ runner.os }}-

      - name: Install sing-box
        if: steps.singbox-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://sing-box.app/gpg.key | sudo tee /etc/apt/trusted.gpg.d/sagernet.asc
          echo "deb https://deb.sagernet.org/ * *" | sudo tee /etc/apt/sources.list.d/sagernet.list
          sudo apt-get update && sudo apt-get install -y sing-box

      - name: Install Xray core (Happ-совместимый клиент)
        run: |
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v25.12.8/Xray-linux-64.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/xray.zip').extractall('/tmp/xray')"
          sudo cp /tmp/xray/xray /usr/local/bin/xray
          sudo cp /tmp/xray/geoip.dat /tmp/xray/geosite.dat /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download GeoIP database
        env:
          GEOIP_LICENSE_KEY: ${{ secrets.GEOIP_LICENSE_KEY }}
        run: python -m backend.download_geoip
        continue-on-error: true

      - name: Restore state from stats branch
        run: |
          git fetch origin stats 2>/dev/null && git show stats:proxy-history.json > proxy-history.json 2>/dev/null || echo "{}" > proxy-history.json

      - name: Download current configs from subscription branch
        run: |
          curl -fsSL -o NetherLink-Clash.yaml "https://raw.githubusercontent.com/${{ github.repository }}/subscription/NetherLink-Clash.yaml" || echo "No main"
          curl -fsSL -o NetherLink-100.yaml "https://raw.githubusercontent.com/${{ github.repository }}/subscription/NetherLink-100.yaml" || echo "No top-100"
          curl -fsSL -o NetherLink-50.yaml  "https://raw.githubusercontent.com/${{ github.repository }}/subscription/NetherLink-50.yaml"  || echo "No top-50"

      - name: Run recheck
        run: python -m backend.recheck_headless

      - name: Deploy rechecked configs to subscription + stats branches
        if: success()
        run: |
          git config user.name "NetherLink Recheck Bot"
          git config user.email "bot@netherlink.local"

          # Сохраняем ДО переключения ветки
          mkdir -p /tmp/nl-recheck
          cp -f NetherLink-50*.yaml NetherLink-50*.json NetherLink-100*.yaml NetherLink-100*.json proxy-history.json /tmp/nl-recheck/ 2>/dev/null || true

          # ── subscription: обновляем топ-50/топ-100, остальные конфиги сохраняем ──
          git fetch origin subscription 2>/dev/null || true
          mkdir -p /tmp/nl-sub
          if git rev-parse --verify origin/subscription >/dev/null 2>&1; then
            git archive origin/subscription | tar -x -C /tmp/nl-sub 2>/dev/null || true
          fi
          git checkout --orphan subscription
          git clean -fdx 2>/dev/null || true
          cp -f /tmp/nl-sub/* . 2>/dev/null || true
          for f in NetherLink-50*.yaml NetherLink-50*.json NetherLink-100*.yaml NetherLink-100*.json; do
            [ -f "/tmp/nl-recheck/$f" ] && cp -f "/tmp/nl-recheck/$f" .
          done
          git add -A
          git commit --allow-empty -m "Recheck update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push --force origin subscription

          # ── stats: обновляем только историю (LiveProxy-файлы не трогаем) ──
          git fetch origin stats 2>/dev/null || true
          mkdir -p /tmp/nl-stats
          if git rev-parse --verify origin/stats >/dev/null 2>&1; then
            git archive origin/stats | tar -x -C /tmp/nl-stats 2>/dev/null || true
          fi
          git checkout --orphan stats
          git clean -fdx 2>/dev/null || true
          cp -f /tmp/nl-stats/* . 2>/dev/null || true
          cp -f /tmp/nl-recheck/proxy-history.json .
          git add -A
          git commit --allow-empty -m "History update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push --force origin stats
