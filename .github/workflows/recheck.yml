name: Recheck Top Proxies

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: netherlink-state-branch
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache sing-box binary
        uses: actions/cache@v4
        id: singbox-cache
        with:
          path: /usr/local/bin/sing-box
          key: sing-box-${{ runner.os }}-1.11.5
          restore-keys: sing-box-${{ runner.os }}-

      - name: Install sing-box
        if: steps.singbox-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://sing-box.app/gpg.key | sudo tee /etc/apt/trusted.gpg.d/sagernet.asc
          echo "deb https://deb.sagernet.org/ * *" | sudo tee /etc/apt/sources.list.d/sagernet.list
          sudo apt-get update && sudo apt-get install -y sing-box

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state
        run: |
          git fetch origin state 2>/dev/null && git show origin/state:proxy-history.json > proxy-history.json || echo "{}" > proxy-history.json

      - name: Download current configs from gh-pages
        run: |
          curl -fsSL -o NetherLink.yaml     "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/NetherLink.yaml"     || echo "No main"
          curl -fsSL -o NetherLink-100.yaml "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/NetherLink-100.yaml" || echo "No top-100"
          curl -fsSL -o NetherLink-50.yaml  "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/NetherLink-50.yaml"  || echo "No top-50"

      - name: Run recheck
        run: python -m backend.recheck_headless

      - name: Commit updated state
        if: success()
        run: |
          git config user.name "NetherLink Recheck Bot"
          git config user.email "bot@netherlink.local"
          set +e
          PUSHED=false
          for attempt in 1 2 3; do
            echo "State commit attempt $attempt/3"
            git fetch origin state 2>/dev/null
            BEFORE_SHA=$(git rev-parse origin/state 2>/dev/null || echo "")
            git show origin/state:proxy-history.json > /tmp/state-old.json 2>/dev/null || echo '{}' > /tmp/state-old.json
            [ -f proxy-history.json ] && cp proxy-history.json /tmp/state-new.json || echo '{}' > /tmp/state-new.json
            python3 backend/merge_history.py /tmp/state-old.json /tmp/state-new.json
            git checkout --orphan state-new
            git rm -rf . 2>/dev/null || true
            cp proxy-history.json .
            git add proxy-history.json
            git commit -m "Update proxy state $(date -u +'%Y-%m-%d %H:%M UTC')"
            if [ -z "$BEFORE_SHA" ]; then
              git push --force origin state-new:state && PUSHED=true && break
            else
              if git push --force-with-lease=state:$BEFORE_SHA origin state-new:state 2>/dev/null; then
                PUSHED=true; break
              fi
            fi
            echo "Push conflict — retry in 3s..."
            sleep 3
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::Failed to push state after 3 attempts — history data lost for this run"
            exit 1
          fi
          set -e

      - name: Deploy rechecked configs to gh-pages
        if: success()
        run: |
          mkdir -p /tmp/recheck-deploy
          for f in NetherLink-50*.yaml NetherLink-50*.json NetherLink-100*.yaml NetherLink-100*.json live.txt; do
            [ -f "$f" ] && cp "$f" "/tmp/recheck-deploy/$f"
          done
          git fetch origin gh-pages 2>/dev/null && git checkout gh-pages || git checkout --orphan gh-pages
          git rm -rf . 2>/dev/null || true
          if ls /tmp/recheck-deploy/* 1>/dev/null 2>&1; then
            cp /tmp/recheck-deploy/* .
          fi
          git add -A
          git commit --allow-empty -m "Recheck update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push --force origin gh-pages
