name: Recheck Top Proxies

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: netherlink-state-branch
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache sing-box binary
        uses: actions/cache@v4
        id: singbox-cache
        with:
          # apt-get install sing-box кладёт бинарник в /usr/bin, а не /usr/local/bin.
          path: /usr/bin/sing-box
          key: sing-box-${{ runner.os }}-1.11.5
          restore-keys: sing-box-${{ runner.os }}-

      - name: Install sing-box
        if: steps.singbox-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://sing-box.app/gpg.key | sudo tee /etc/apt/trusted.gpg.d/sagernet.asc
          echo "deb https://deb.sagernet.org/ * *" | sudo tee /etc/apt/sources.list.d/sagernet.list
          sudo apt-get update && sudo apt-get install -y sing-box

      - name: Install Xray core (Happ-совместимый клиент)
        run: |
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v25.12.8/Xray-linux-64.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/xray.zip').extractall('/tmp/xray')"
          sudo cp /tmp/xray/xray /usr/local/bin/xray
          sudo cp /tmp/xray/geoip.dat /tmp/xray/geosite.dat /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download GeoIP database
        env:
          GEOIP_LICENSE_KEY: ${{ secrets.GEOIP_LICENSE_KEY }}
        run: python -m backend.download_geoip
        continue-on-error: true

      - name: Restore state from state branch
        run: |
          git fetch origin state 2>/dev/null && git show state:proxy-history.json > proxy-history.json 2>/dev/null || echo "{}" > proxy-history.json

      - name: Download current configs from gh-pages
        run: |
          curl -fsSL -o NetherLink.yaml     "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/NetherLink.yaml"     || echo "No main"
          curl -fsSL -o NetherLink-100.yaml "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/NetherLink-100.yaml" || echo "No top-100"
          curl -fsSL -o NetherLink-50.yaml  "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/NetherLink-50.yaml"  || echo "No top-50"

      - name: Run recheck
        run: python -m backend.recheck_headless

      - name: Deploy rechecked configs to gh-pages (clean)
        if: success()
        run: |
          git config user.name "NetherLink Recheck Bot"
          git config user.email "bot@netherlink.local"

          # Сохраняем ДО переключения ветки
          mkdir -p /tmp/nl-recheck
          cp -f NetherLink-50*.yaml NetherLink-50*.json NetherLink-100*.yaml NetherLink-100*.json live.txt proxy-history.json /tmp/nl-recheck/ 2>/dev/null || true

          # ── gh-pages: обновляем топ-50/топ-100, без мусора ──
          git fetch origin gh-pages 2>/dev/null && git checkout gh-pages || git checkout --orphan gh-pages
          for f in NetherLink-50*.yaml NetherLink-50*.json NetherLink-100*.yaml NetherLink-100*.json live.txt; do
            [ -f "/tmp/nl-recheck/$f" ] && cp -f "/tmp/nl-recheck/$f" . 2>/dev/null
          done
          git add -A
          git commit --allow-empty -m "Recheck update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push --force origin gh-pages

          # ── state: история проверок ──
          git checkout --orphan state-new
          cp -f /tmp/nl-recheck/proxy-history.json . 2>/dev/null || true
          git add proxy-history.json 2>/dev/null || true
          git commit --allow-empty -m "Proxy history $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin state-new:state
